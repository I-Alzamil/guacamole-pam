<div class="select-field pam-password-policy-field">
    <select ng-model="model" ng-attr-id="{{ fieldId }}" ng-disabled="disabled || !policies"
            ng-options="policy.id as policy.name for policy in policies">
        <option value="">{{ (ofConnection ? 'PAM.FIELD_OPTION_PASSWORD_POLICY_PLATFORM'
                                          : 'PAM.FIELD_OPTION_PASSWORD_POLICY_DEFAULT') | translate }}</option>
    </select>
</div>
