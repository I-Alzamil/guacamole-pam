<div class="menu-section pam-session-password" ng-if="isShown()">
    <h3>{{ 'PAM.SESSION.SECTION_HEADER_PASSWORD' | translate }}</h3>
    <div class="content">

        <p class="description" ng-if="!grant">
            {{ (entry().managed ? 'PAM.REQUEST.ACCESS_HELP_PASSWORD_MANAGED' : 'PAM.REQUEST.ACCESS_HELP_PASSWORD') | translate }}
        </p>
        <p class="pam-request-error" ng-show="error">{{ error }}</p>

        <button ng-if="!grant" ng-click="show()" ng-disabled="busy">{{ 'PAM.REQUEST.ACTION_SHOW_AGAIN' | translate }}</button>

        <!-- No wrapper: the menu spaces every block of a section -->
        <p ng-if="grant.accountName" class="pam-request-username">
            {{ 'PAM.REQUEST.FIELD_USERNAME' | translate }} <span>{{ grant.accountName }}</span>
        </p>
        <div class="pam-request-password" ng-if="grant">
            <input ng-attr-type="{{ revealed ? 'text' : 'password' }}" readonly
                   value="{{ grant.password }}" autocomplete="off" spellcheck="false"
                   aria-label="{{ 'PAM.REQUEST.FIELD_PASSWORD' | translate }}"/>
            <button ng-click="toggleReveal()">{{ (revealed ? 'PAM.REQUEST.ACTION_HIDE' : 'PAM.REQUEST.ACTION_SHOW') | translate }}</button>
            <button ng-click="copy()">{{ (copied ? 'PAM.REQUEST.INFO_COPIED' : 'PAM.REQUEST.ACTION_COPY') | translate }}</button>
        </div>

    </div>
</div>
