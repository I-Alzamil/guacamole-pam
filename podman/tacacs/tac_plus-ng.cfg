# Test configuration: every client, shared secret "TacacsSecr3t", accounts in
# /etc/tacacs/shadow (set by starttacacs.sh and the suites), password
# changes allowed ("chpass"). Accounts must also be declared here.
id = spawnd {
	background = no
	listen { port = 49 }
}

id = tac_plus-ng {
	log lf { destination = /dev/stderr }
	authentication log = lf
	access log = lf

	mavis module = external {
		setenv SHADOWFILE = /etc/tacacs/shadow
		setenv MKPASSWD = /usr/bin/mkpasswd
		setenv MKPASSWDMETHOD = sha-512
		exec = /usr/local/lib/mavis/mavis_tacplus_shadow.pl
	}
	login backend = mavis chpass
	pap backend = mavis

	host world {
		address = 0.0.0.0/0
		key = TacacsSecr3t
	}

	profile login {
		script {
			if (service == shell) {
				set priv-lvl = 1
				permit
			}
		}
	}

	user tactest {
		password login = mavis
		profile = login
	}

	user t2tac {
		password login = mavis
		profile = login
	}
}
